name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../training
      - run: pytest -q tests ../training/tests
      - name: License check (fail on copyleft / source-available)
        run: |
          pip-licenses --from=mixed --fail-on="GPL;GNU General Public License;AGPL;GNU Affero;SSPL;Server Side Public License;EUPL;EPL;Eclipse Public License;Elastic License;Business Source License" \
            --ignore-packages pip-licenses

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: License check (production dependencies)
        run: npx --yes license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;BlueOak-1.0.0"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowlens-api ./backend
      - run: docker build -t flowlens-web ./frontend
