# Maps imported packages to external services.
#
# id:        stable identifier
# label:     name shown in the UI
# category:  drives the icon (database, cache, storage, payment, chat, email,
#            http, llm, docs, devtools, crm, queue, cloud, auth, search, commerce)
# packages:  Python modules or npm packages. A package matches when the import
#            equals it or starts with it followed by "." or "/".
#
# Contributions welcome: add a service by appending an entry.

